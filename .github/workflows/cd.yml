name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Overlay do Kubernetes usado no deploy'
        required: true
        default: 'oci'
        type: choice
        options: [oci, aws]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publicar:
    name: Publicar imagens no GHCR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.versao.outputs.tag }}
      repo: ${{ steps.repo.outputs.nome }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag da versão
        id: versao
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Normalizar nome do repositório
        id: repo
        run: echo "nome=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.nome }}/agrinexus-backend:${{ steps.versao.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.nome }}/agrinexus-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            REACT_APP_API_URL=${{ vars.REACT_APP_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.nome }}/agrinexus-frontend:${{ steps.versao.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.nome }}/agrinexus-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no Kubernetes
    if: github.event_name == 'workflow_dispatch'
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Instalar kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configurar acesso ao cluster
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Montar secret da aplicação
        run: |
          cat > k8s/base/secret.env <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Apontar para as imagens recém-publicadas
        run: |
          cd "k8s/overlays/${{ inputs.ambiente }}"
          kustomize edit set image \
            "agrinexus-backend=${{ env.REGISTRY }}/${{ needs.publicar.outputs.repo }}/agrinexus-backend:${{ needs.publicar.outputs.tag }}" \
            "agrinexus-frontend=${{ env.REGISTRY }}/${{ needs.publicar.outputs.repo }}/agrinexus-frontend:${{ needs.publicar.outputs.tag }}"

      - name: Aplicar manifests
        run: kubectl apply -k "k8s/overlays/${{ inputs.ambiente }}"

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/backend -n agrinexus --timeout=300s
          kubectl rollout status deployment/frontend -n agrinexus --timeout=300s
