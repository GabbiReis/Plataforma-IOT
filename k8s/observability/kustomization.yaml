apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml
  - ingress.yaml

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/agrinexus.json

secretGenerator:
  - name: grafana-admin
    envs:
      - secret.env

generatorOptions:
  disableNameSuffixHash: true
