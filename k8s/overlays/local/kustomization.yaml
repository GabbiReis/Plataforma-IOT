apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: agrinexus-config
    patch: |-
      - op: replace
        path: /data/CORS_ALLOW_ORIGINS
        value: http://app.127.0.0.1.nip.io
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Ingress
      name: agrinexus
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.127.0.0.1.nip.io
      - op: replace
        path: /spec/rules/1/host
        value: api.127.0.0.1.nip.io
